<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Aster 聊天翻译</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 提示条（浏览器调试时用；外壳下是独立小窗口） -->
<div class="toast" id="toast" hidden><span class="toast-star"></span><span id="toastText"></span></div>

<div class="popup" id="popup">

  <!-- 星点：只铺在标题带，压在最底 -->
  <div class="sky" id="sky" aria-hidden="true">
    <i style="left:7%;top:58%;animation-delay:-.4s"></i>
    <i style="left:19%;top:24%;animation-delay:-1.6s"></i>
    <i style="left:32%;top:64%;animation-delay:-2.7s"></i>
    <i style="left:45%;top:26%;animation-delay:-3.4s"></i>
    <i style="left:56%;top:60%;animation-delay:-1.1s"></i>
    <i style="left:66%;top:22%;animation-delay:-2.2s"></i>
    <i style="left:74%;top:56%;animation-delay:-3.9s"></i>
    <b style="left:26%;top:44%;animation-delay:-1.8s"></b>
    <b style="left:50%;top:48%;animation-delay:-3.1s"></b>
    <b style="left:70%;top:36%;animation-delay:-.9s"></b>
  </div>

  <header class="bar">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><use href="#star"/></svg>
    <span class="bar-title" id="barTitle">Aster 聊天翻译</span>
    <span class="engine-note" id="engineNote" hidden></span>
    <span class="bar-actions">
      <button class="icon" id="btnSettings" title="设置">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4">
          <circle cx="7" cy="7" r="4.1"/>
        </svg>
      </button>
      <button class="icon" id="btnClose" title="关闭">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <path d="M2.4 2.4l9.2 9.2M11.6 2.4l-9.2 9.2"/>
        </svg>
      </button>
    </span>
  </header>

  <div class="scroll" id="scroll">
    <section class="card">
      <h2 class="card-title" id="rawTitle">原文</h2>
      <div class="raw" id="rawText"></div>
    </section>

    <section class="card">
      <h2 class="card-title" id="transTitle">翻译</h2>
      <div class="rows" id="transRows"></div>
    </section>

    <section class="card judge" id="judgeCard" hidden>
      <h2 class="card-title">判断</h2>
      <p class="judge-text" id="judgeText"></p>
    </section>
  </div>

  <div class="float-replies" id="floatReplies" hidden>
    <div class="reply-head" id="replyHead" hidden></div>
    <div class="replies" id="replies"></div>
    <div class="drawer-hint" id="drawerHint">下方输入中文 进行实时翻译</div>
  </div>

  <button class="drawer-ball" id="drawerBall" title="建议回复">
    <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#starFab"/></svg>
  </button>

  <footer class="input-bar">
    <span class="field-label">我想说</span>
    <label class="field">
      <span class="field-hint" id="intentHint">用中文写，回车生成英文</span>
      <input class="field-input" id="intent" autocomplete="off" spellcheck="false">
    </label>
    <button class="pill" id="btnGenerate">生成</button>
  </footer>

</div>

<!-- ============ 星标符号：主标 / 双星 / 小尺寸简化 ============ -->
<script src="icons.js"></script>

<script src="common.js"></script>
<script src="sky.js"></script>
<script src="app.js"></script>
</body>
</html>
